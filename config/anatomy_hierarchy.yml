# xcat2vtk anatomy classification defaults.
#
# The parser intentionally supports a small YAML subset so the converter does
# not need a new runtime dependency. Custom files can add aliases or rules using
# the same fields shown here.

aliases:
  lkidney:
    canonical_name: kidney
    normalized_name: kidney
    laterality: left
  rkidney:
    canonical_name: kidney
    normalized_name: kidney
    laterality: right
  lv:
    canonical_name: left_ventricle
    normalized_name: left_ventricle
    laterality: left
  rv:
    canonical_name: right_ventricle
    normalized_name: right_ventricle
    laterality: right
  la:
    canonical_name: left_atrium
    normalized_name: left_atrium
    laterality: left
  ra:
    canonical_name: right_atrium
    normalized_name: right_atrium
    laterality: right
  lad:
    canonical_name: left_anterior_descending_coronary_artery
    normalized_name: left_anterior_descending_coronary_artery
    laterality: left
    structure_type: artery
  dias_lv:
    canonical_name: left_ventricle
    normalized_name: left_ventricle
    laterality: left
    structure_type: heart
    temporal_phase: diastole
  sys_lv:
    canonical_name: left_ventricle
    normalized_name: left_ventricle
    laterality: left
    structure_type: heart
    temporal_phase: systole

rules:
  - id: pulmonary_artery
    priority: 100
    pattern: ".*pulmonary.*arter.*"
    system: cardiovascular
    subsystem: pulmonary_circulation/arteries
    anatomical_region: thorax
    structure_type: artery
    hierarchy_path: 01_Cardiovascular/Pulmonary_Circulation/Arteries
    confidence: high
  - id: pulmonary_vein
    priority: 100
    pattern: ".*pulmonary.*vein.*"
    system: cardiovascular
    subsystem: pulmonary_circulation/veins
    anatomical_region: thorax
    structure_type: vein
    hierarchy_path: 01_Cardiovascular/Pulmonary_Circulation/Veins
    confidence: high
  - id: coronary_artery
    priority: 95
    pattern: ".*(coronary|left_anterior_descending|lad|rca|lcx).*arter.*|^(left_anterior_descending_coronary_artery|lad|rca|lcx)$"
    system: cardiovascular
    subsystem: coronary_circulation/coronary_arteries
    anatomical_region: thorax
    structure_type: artery
    hierarchy_path: 01_Cardiovascular/Coronary_Circulation/Coronary_Arteries
    confidence: high
  - id: coronary_vein
    priority: 95
    pattern: ".*coronary.*vein.*"
    system: cardiovascular
    subsystem: coronary_circulation/coronary_veins
    anatomical_region: thorax
    structure_type: vein
    hierarchy_path: 01_Cardiovascular/Coronary_Circulation/Coronary_Veins
    confidence: high
  - id: heart
    priority: 90
    pattern: ".*(heart|atrium|ventricle|myocard|pericard|left_ventricle|right_ventricle|left_atrium|right_atrium).*"
    system: cardiovascular
    subsystem: heart_and_pericardium
    anatomical_region: thorax
    structure_type: heart
    hierarchy_path: 01_Cardiovascular/Heart_and_Pericardium
    confidence: high
  - id: great_vessels
    priority: 88
    pattern: ".*(aorta|vena_cava|pulmonary_trunk|brachiocephalic).*"
    system: cardiovascular
    subsystem: great_vessels
    anatomical_region: thorax
    structure_type: other
    hierarchy_path: 01_Cardiovascular/Great_Vessels
    confidence: high
  - id: portal_hepatic_venous
    priority: 86
    pattern: ".*(portal_vein|hepatic_vein).*"
    system: cardiovascular
    subsystem: portal_and_hepatic_venous_system
    anatomical_region: abdomen
    structure_type: vein
    hierarchy_path: 01_Cardiovascular/Portal_and_Hepatic_Venous_System
    confidence: high
  - id: cerebrovascular_artery
    priority: 84
    pattern: ".*(cerebral|carotid|vertebral|basilar|circle_of_willis).*arter.*"
    system: cardiovascular
    subsystem: cerebrovascular/arteries
    anatomical_region: head_and_neck
    structure_type: artery
    hierarchy_path: 01_Cardiovascular/Cerebrovascular/Arteries
    confidence: high
  - id: cerebrovascular_vein
    priority: 84
    pattern: ".*(cerebral|dural|sinus|sagittal).*vein.*|.*dural.*sinus.*"
    system: cardiovascular
    subsystem: cerebrovascular/veins_and_dural_sinuses
    anatomical_region: head_and_neck
